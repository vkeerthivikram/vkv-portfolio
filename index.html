<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#28644a" />
    <title>V Keerthi Vikram — Apps, tools & experiments</title>
    <meta
      name="description"
      content="Explore V Keerthi Vikram’s independent software projects: Android apps, web tools, terminal utilities, and open-source themes. Built with curiosity, shared openly."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="V Keerthi Vikram — Curiosity in. Useful software out."
    />
    <meta
      property="og:description"
      content="Apps, developer tools, and small experiments that make everyday things a little better. Explore the projects and the thinking behind them."
    />
    <meta property="og:image" content="/images/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("portfolio-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#111a15" : "#28644a";
      })();
    </script>
    <link rel="preload" as="image" href="/images/building-blocks.webp" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "V Keerthi Vikram",
        "sameAs": [
          "https://github.com/vkeerthivikram",
          "https://www.linkedin.com/in/v-keerthi-vikram/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
